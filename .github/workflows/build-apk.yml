name: 🚀 Build APK - ZUVEX

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # permite rodar manualmente

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # 1. Checkout do código
      - name: 📥 Checkout código
        uses: actions/checkout@v4

      # 2. Instalar Java (necessário para Android)
      - name: ☕ Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. Instalar Flutter
      - name: 🐦 Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'
          cache: true

      # 4. Verificar versões
      - name: 🔍 Verificar ambiente
        run: |
          flutter --version
          java -version

      # 5. Instalar dependências
      - name: 📦 Instalar dependências
        run: flutter pub get

      # 6. Criar google-services.json a partir do Secret
      - name: 🔐 Configurar Firebase (google-services.json)
        run: |
          echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > android/app/google-services.json

      # 7. Analisar código
      - name: 🔬 Analisar código
        run: flutter analyze --no-fatal-infos
        continue-on-error: true

      # 8. Build APK (release)
      - name: 🏗️ Build APK Release
        run: flutter build apk --release --no-tree-shake-icons

      # 9. Renomear APK Oficial v1
      - name: 📝 Renomear APK Oficial
        run: |
          mkdir -p artifacts
          cp build/app/outputs/flutter-apk/app-release.apk artifacts/ZUVEX-v1.apk
          echo "APP_TAG=v1" >> $GITHUB_ENV
          echo "APK_NAME=ZUVEX-v1.apk" >> $GITHUB_ENV

      # 10. Upload do APK como artifact
      - name: 📤 Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZUVEX-APK
          path: artifacts/*.apk
          retention-days: 30

      # 11. Criar Release automática (apenas no push para main)
      - name: 🏷️ Criar Release no GitHub
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1
          name: "ZUVEX v1"
          body: |
            ## 📱 ZUVEX v1 - Versão Oficial

            **Versão:** v1 (Lançamento Oficial)
            **Branch:** ${{ github.ref_name }}
            **Commit:** ${{ github.sha }}

            ### 📥 Como instalar:
            1. Baixe o arquivo `ZUVEX-v1.apk` abaixo
            2. No celular: autorize a instalação de fontes desconhecidas se solicitado
            3. Abra o arquivo APK para instalar ou atualizar

            > ⚡ **Pix Integrado** — Pagamentos instantâneos com liberação automática de anúncios.
          files: artifacts/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
